name: Deploy site

# Builds the static Next.js export and commits ./out to the gh-pages branch
# (the branch GitHub Pages already serves). Normal commits, no force-push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit ./out to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" site
          cd site
          git rm -rq --ignore-unmatch .
          cp -a ../out/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
